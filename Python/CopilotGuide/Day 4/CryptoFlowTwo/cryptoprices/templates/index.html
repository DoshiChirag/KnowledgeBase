<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Prices</title>
</head>
<body>
    <h1>Cryptocurrency and Gold Prices</h1>
    <ul id="crypto-list">
        {% for name, details in prices.items() %}
        {% if name != 'Gold' %}
        <li>{{ name }}: ${{ details.usd }}</li>
        {% endif %}
        {% endfor %}
    </ul>
    <ul id="gold-list">
        {% if 'Gold' in prices %}
        <li>Gold: ${{ prices['Gold'].usd }}</li>
        {% endif %}
    </ul>
</body>
</html>
